apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: microshop
data:                                # ConfigMap 存明文，不适合放密码
  DB_HOST: "mysql"                   # 服务名，K8s DNS 会解析成 ClusterIP
  DB_PORT: "3306"
  DB_NAME: "microshop"
  DB_USER: "root"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: microshop
data:
  init.sql: |                        # MySQL 首次启动时自动执行建库建表
    CREATE DATABASE IF NOT EXISTS microshop DEFAULT CHARACTER SET utf8mb4;
    USE microshop;
    CREATE TABLE IF NOT EXISTS orders (
        id INT AUTO_INCREMENT PRIMARY KEY,
        product VARCHAR(100) NOT NULL,
        quantity INT NOT NULL DEFAULT 1,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    INSERT INTO orders (product, quantity) VALUES
        ('iPhone 15 Pro', 2),
        ('MacBook Air', 1),
        ('AirPods Pro', 3);
